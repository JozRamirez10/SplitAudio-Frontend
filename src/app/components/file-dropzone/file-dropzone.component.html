@if (!selectedFile()) {
  <label
    class="dropzone"
    [class.dropzone--dragging]="isDragging()"
    [class.dropzone--disabled]="disabled()"
    (dragover)="onDragState($event, true)"
    (dragleave)="onDragState($event, false)"
    (drop)="onDrop($event)">

    <input
      type="file"
      class="hidden"
      accept=".mp3,.wav,.flac,.m4a,.ogg"
      [disabled]="disabled()"
      (change)="onFileInputChange($event)" />

    <div class="icon-box-lg">
      <ion-icon name="cloud-upload-outline" class="text-3xl"></ion-icon>
    </div>

    <p class="dropzone__title">
      Arrastra tu archivo de audio aquí o <span class="text-indigo-400 underline">explora</span>
    </p>
    <span class="dropzone__subtitle">
      MP3, WAV, FLAC, M4A u OGG (Máx. 200 MB)
    </span>
  </label>
} @else {
  <div class="file-preview">
    <div class="file-preview__info">
      <div class="icon-box-md">
        <ion-icon name="musical-note-outline" class="text-xl"></ion-icon>
      </div>
      <div class="min-w-0">
        <p class="file-preview__name">{{ selectedFile()!.name }}</p>
        <span class="file-preview__size">{{ formattedSize() }}</span>
      </div>
    </div>

    @if (!disabled()) {
      <button
        type="button"
        (click)="onRemoveFile($event)"
        class="btn-danger-icon"
        title="Quitar archivo">
        <ion-icon name="trash-outline" class="text-base"></ion-icon>
      </button>
    }
  </div>
}

@if (validationError()) {
  <div class="alert-error">
    {{ validationError() }}
  </div>
}

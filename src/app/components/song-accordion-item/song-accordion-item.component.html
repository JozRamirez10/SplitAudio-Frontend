<div class="accordion-card">

  <div (click)="toggleAccordion()" class="accordion-card__header">

    <div class="accordion-card__info">
      <div class="icon-box-md">
        <ion-icon name="musical-notes-outline" class="text-xl"></ion-icon>
      </div>

      <div class="min-w-0 mr-2">
        <h3 class="accordion-card__title">{{ song().songName }}</h3>
        <span class="accordion-card__subtitle">
          {{ song().tracks.length }} pistas disponibles
        </span>
      </div>

      <div class="accordion-card__badges">
        <span class="badge-key">Key: {{ song().musicalKey }}</span>
        <span class="badge-bpm">{{ song().bpm }} BPM</span>
        <span class="badge-hz">{{ song().tuningHz }} Hz</span>
      </div>
    </div>

    <div class="accordion-card__controls">
      <!-- Solo los 3 botones detienen la propagación -->
      <div class="accordion-card__actions" (click)="$event.stopPropagation()">
        
        <button
          type="button"
          [disabled]="isDownloadingZip()"
          (click)="onDownloadZip()"
          class="btn-secondary-sm">
          @if (isDownloadingZip()) {
            <ion-spinner name="crescent" class="w-4 h-4 text-indigo-400"></ion-spinner>
            <span>Empaquetando...</span>
          } @else {
            <ion-icon name="archive-outline" class="text-base text-indigo-400"></ion-icon>
            <span>Descargar ZIP</span>
          }
        </button>

        <!-- Bloque del Tooltip Refactorizado -->
        <div class="accordion-card__tooltip-wrapper">
          
          <div class="accordion-card__tooltip-bubble">
            Próximamente: Mezcladora multipista
            <div class="accordion-card__tooltip-arrow"></div>
          </div>

          <button 
            type="button" 
            class="btn-primary-sm accordion-card__btn-disabled"
            (click)="$event.preventDefault()">
            <ion-icon name="options-outline" class="text-base"></ion-icon>
            <span>Abrir DAW</span>
          </button>

        </div>

        <button
          type="button"
          (click)="onDeleteSong()"
          class="btn-danger-icon"
          title="Eliminar canción">
          <ion-icon name="trash-outline" class="text-base"></ion-icon>
        </button>

      </div>

      <!-- La flecha queda libre para activar toggleAccordion() -->
      <div class="accordion-card__chevron">
        <ion-icon
          name="chevron-down-outline"
          class="text-lg transition-transform duration-200"
          [class.rotate-180]="isOpen()">
        </ion-icon>
      </div>
    </div>

  </div>

  @if (isOpen()) {
    <div class="accordion-card__body">
      <p class="accordion-card__section-label">Pistas separadas (Stems)</p>
      <div class="accordion-card__grid">
        @for (track of song().tracks; track track.id) {
          <app-track-item
            [track]="track"
            (download)="onTrackDownload($event)">
          </app-track-item>
        }
      </div>
    </div>
  }

</div>

<div class="track-row group">
  <div class="track-row__info">
    <div class="icon-box-sm">
      <ion-icon [name]="iconName()" class="text-lg"></ion-icon>
    </div>
    <div class="truncate">
      <p class="track-row__title">{{ displayLabel() }}</p>
      <span class="track-row__type">{{ track().trackType }}</span>
    </div>
  </div>

  <button
    type="button"
    (click)="onDownloadClick()"
    class="track-row__download-btn"
    title="Descargar pista">
    <ion-icon name="download-outline" class="text-base"></ion-icon>
    <span>Descargar</span>
  </button>
</div>

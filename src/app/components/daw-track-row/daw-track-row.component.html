<div
  class="daw-track"
  [class.daw-track--silent]="isEffectivelySilent()"
  [class.daw-track--metronome]="isMetronome()">

  <div class="daw-track__identity">
    <div class="daw-track__icon" [class.daw-track__icon--metronome]="isMetronome()">
      <ion-icon [name]="iconName()" class="text-lg"></ion-icon>
    </div>

    <div class="min-w-0">
      <p class="daw-track__name">{{ displayLabel() }}</p>
      <span class="daw-track__type">{{ trackState().track.trackType }}</span>
    </div>
  </div>

  <div class="daw-track__controls">
    <div class="daw-track__buttons">
      <button
        type="button"
        (click)="toggleMute.emit()"
        class="daw-track__btn-control"
        [class.daw-track__btn-control--mute-active]="trackState().isMuted"
        title="Silenciar pista (Mute)">
        M
      </button>

      <button
        type="button"
        (click)="toggleSolo.emit()"
        class="daw-track__btn-control"
        [class.daw-track__btn-control--solo-active]="trackState().isSolo"
        title="Aislar pista (Solo)">
        S
      </button>
    </div>

    <div class="daw-track__fader">
      <ion-icon
        [name]="isEffectivelySilent() ? 'volume-mute-outline' : 'volume-high-outline'"
        class="text-base text-slate-400 shrink-0">
      </ion-icon>

      <input
        type="range"
        min="0"
        max="1"
        step="0.01"
        [value]="trackState().volume"
        (input)="onVolumeInput($event)"
        class="daw-track__slider"
        [attr.aria-label]="'Volumen de ' + displayLabel()" />

      <span class="daw-track__percent">{{ volumePercent() }}%</span>
    </div>

    <button
      type="button"
      (click)="download.emit(trackState().track)"
      class="daw-track__download"
      title="Descargar pista WAV">
      <ion-icon name="download-outline" class="text-base"></ion-icon>
      <span class="hidden md:inline">WAV</span>
    </button>
  </div>

</div>

services:
  split-audio-frontend:
    container_name: split_audio_frontend
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - split-audio-net

networks:
  split-audio-net:
    name: split-audio-net